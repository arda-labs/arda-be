# Human labels for Jev judge calibration (plan B3).
#
# The calibration runner compares these labels with a judge artifact produced
# by `go run ./cmd/ai-eval -mode=answer` with AI_EVAL_JUDGE=jev and
# AI_ANSWER_EVAL_ARTIFACT set:
#
#   go run ./cmd/ai-eval -mode=judge-calibrate
#
# Conventions:
# - grounded / answers_question are booleans for the reviewed answer.
# - correct_abstention only applies to allow_no_answer cases; null elsewhere.
# - null means the dimension does not apply to that case.
# - These labels describe the expected behaviour, not a review of a specific
#   model answer. Re-verify them against the answers stored in the artifact
#   (answer_excerpt) before enabling any strict gate.
version: 1
description: >-
  Human labels for the Jev answer judge across the dev corpus answer set and
  the FAQ answer set.
cases:
  # --- scripts/ai-dev-corpus/answer-evaluation-set.yaml ---------------------
