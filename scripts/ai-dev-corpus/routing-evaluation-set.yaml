version: 1
description: >-
  Dev-only routing golden set for the Jev decision router. Cases run directly
  against the configured System One provider (no ai-service hop, no tenant
  model) and carry user messages only, mirroring the production state built by
  decision.BuildState. expected_skill is the reviewed target skill;
  must_not_route lists skills that count as critical false positives.
  A latest user message over the production 4096-byte classification budget is
  skipped by BuildState and therefore expected to fall back to general.
metrics:
  - routing_accuracy
  - macro_f1
  - critical_false_positive
cases:
  # --- report / loan_portfolio ---------------------------------------------
