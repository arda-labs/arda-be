name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install protobuf toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate OpenAPI pilot
        run: node scripts/check-openapi.mjs
      - name: Validate migration conventions
        run: node scripts/check-migrations.mjs
      - name: Validate RLS feasibility pilot
        run: node scripts/check-rls-pilot.mjs
      - name: Validate event registry
        run: node scripts/check-events.mjs
      - name: Validate event runtime durability
        run: node scripts/check-event-runtime.mjs
      - name: Validate interaction policy
        run: node scripts/check-interactions.mjs
      - name: Validate observability contract
        run: node scripts/check-observability-contract.mjs
      - name: Validate fail-closed security invariants
        run: node scripts/check-security-invariants.mjs
      - name: Validate reference service layering
        run: node scripts/check-layering.mjs
      - name: Validate generated protobuf contracts
        run: node scripts/check-proto.mjs
      - name: Validate secret hygiene
        run: node scripts/check-secrets.mjs
      - name: Validate local Compose topology
        run: docker compose config --no-interpolate --quiet
      - name: Test every Go module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "Testing $dir"
            (cd "$dir" && go test ./...)
          done < <(find . -name go.mod -not -path '*/node_modules/*' -print | sort)
      - name: Check patch hygiene
        run: git diff --check
