syntax = "proto3";

package arda.finance.v1;

option go_package = "github.com/arda-labs/arda/libs/go/arda-proto/finance/v1;financev1";

// PostingService is the single journal-entry gate for all Arda domains
// (docs/accounting-posting-contract.md v0.3 + P1b v2 two-phase balance,
// docs/epas-survey/disbursement-flow-deep-dive.md). Only workflow-service
// workers (and finance itself for internal flows like opening balances and
// cash) call it. Money crosses as int64 minor units; accounts are resolved
// from analytics via fin_acc_class_coa_maps at the accounting_date's COA
// version.
//
// Lifecycle (contract §4): Reserve creates a PENDING entry and holds the
// amounts on fin_account_balances (reserved_*); Post moves the hold to
// posted_* and stamps the entry POSTED; Release frees the hold and stamps
// the entry VOID. Direct posts (accrual/provision/cash/...) skip the hold —
// PostTransaction on a request without a PENDING twin books straight to
// posted_*.
service PostingService {
  // Validate resolves accounts and reports per-line results without writing.
  rpc ValidatePosting(PostingRequest) returns (ValidationResult);
  // PostTransaction writes one balanced journal entry (direct posts book
  // POSTED; a request matching an existing PENDING entry — same tenant +
  // idempotency key — moves that entry's hold to posted instead).
  // Idempotent by (tenant_id, idempotency_key); replays return the original
  // response.
  rpc PostTransaction(PostingRequest) returns (PostingResponse);
  // ReservePosting creates the PENDING entry and holds its amounts
  // (available-balance reservation for approval flows). Idempotent by
  // (tenant_id, idempotency_key).
  rpc ReservePosting(PostingRequest) returns (PostingResponse);
  // ReleasePosting frees the reserved amounts of a PENDING entry and stamps
  // it VOID (the maker-checker reject path).
  rpc ReleasePosting(ReleaseRequest) returns (PostingResponse);
  // ReverseTransaction creates a reversal entry; the original is immutable.
  rpc ReverseTransaction(ReverseRequest) returns (PostingResponse);
  // GetJournalEntry reads one entry (header + lines) by entry_no for the
  // accountant cancellation flow: the workflow init/validate steps guard on
  // its status and reversed_by_entry_id before reversing. Only POSTED and
  // REVERSED entries are readable; anything else is NOT_FOUND.
  rpc GetJournalEntry(GetJournalEntryRequest) returns (JournalEntryDetail);
  // ListPostingRules exposes the fin_accounting_rules card for one document
  // type so workflow workers build their posting lines from config instead of
  // hardcoded classification strings. Unseeded document types return an
  // empty rule list (workers fall back to their built-in legs).
  rpc ListPostingRules(ListPostingRulesRequest) returns (ListPostingRulesResponse);
}

message ListPostingRulesRequest {
  string tenant_id = 1;        // resolved from metadata in-process
  string document_type = 2;    // LNM_DISB_REGISTER | LNM_DISB_COMPLETE | LNM_COLLECTION | ...
}

message PostingRule {
  int32 line_no = 1;
  string direction = 2;        // DEBIT | CREDIT
  // resolution_type selects which side applies: CLASS_MAP uses
  // acc_classification, FIXED_CODE uses account_ref directly.
  string resolution_type = 3;
  string account_ref = 4;      // fixed COA code when resolution_type = FIXED_CODE
  string acc_classification = 5; // analytics classification when CLASS_MAP
  repeated string required_dimensions = 6;
  string description_template = 7;
}

message ListPostingRulesResponse {
  repeated PostingRule rules = 1;
}

message BusinessReference {
  string domain = 1;           // lnm | dpm | ibm | cfc | vcm | cob | fin
  string document_type = 2;    // LNM_DISBURSEMENT | LNM_COLLECTION | ...
  string document_id = 3;      // UUID of the domain document
  string document_code = 4;    // business voucher number
  string case_id = 5;          // workflow business case (when approval-driven)
}

message Analytics {
  string acc_classification = 1;
  string debt_group_code = 2;
  string org_unit_code = 3;
  string fund_source_code = 4;
  string customer_code = 5;
  string contract_code = 6;
  map<string, string> dimensions = 7; // registry-validated extras (§8.2)
}

message PostingLine {
  int32 line_no = 1;
  string direction = 2;        // DEBIT | CREDIT
  int64 amount_minor = 3;      // int64 minor units, > 0
  string currency_code = 4;
  Analytics analytics = 5;
  string counterparty_code = 6;
  string counterparty_name = 7;
  string description = 8;
  // Manual posting path (accountant-picked lines, FAC-native flows): when
  // account_code is set the line resolves directly against the COA —
  // coa_version empty = the version effective on the accounting_date — and
  // analytics becomes optional metadata. Classification lines (domain flows)
  // keep using analytics.acc_classification.
  string account_code = 9;
  string coa_version = 10;
}

message PostingRequest {
  string idempotency_key = 1;
  BusinessReference business_reference = 2;
  string accounting_date = 3;  // "YYYY-MM-DD" business date
  string currency_code = 4;
  string description = 5;
  repeated PostingLine lines = 6;
  map<string, string> metadata = 7;
}

message PostingResponse {
  string journal_entry_id = 1;
  int64 entry_no = 2;
  int32 version = 3;
  string posted_at = 4;
  bool replayed = 5;           // idempotent replay of an existing entry
  string status = 6;           // PENDING | POSTED | VOID | REVERSED
}

message ReleaseRequest {
  string journal_entry_id = 1; // the PENDING entry to void
  string reason = 2;
  string actor = 3;
}

message ValidationLine {
  int32 line_no = 1;
  bool resolved = 2;
  string account_code = 3;     // resolved COA account (empty when unresolved)
  string account_name = 4;
  string coa_version = 5;      // COA version the account resolved under
  string direction = 6;
  int64 amount_minor = 7;
  string currency_code = 8;
  Analytics resolved_analytics = 9;
  repeated string errors = 10;
  string description = 11;
}

message ValidationResult {
  bool valid = 1;              // every line resolved AND entry balanced
  repeated ValidationLine lines = 2;
  repeated string global_errors = 3; // UNBALANCED, PERIOD_CLOSED, ...
  string coa_version_id = 4;   // COA version applied for accounting_date
}

message ReverseRequest {
  string tenant_id = 1;        // resolved from metadata in-process
  string journal_entry_id = 2; // or business_reference lookup
  string business_domain = 3;
  // business_document_type overrides the doc type stamped on the reversal
  // entry. Empty keeps the original's doc type (plain correction); the
  // cancellation flow sets FIN_TXN_CANCEL so the journal list can filter the
  // cancel-driven reversals.
  string business_document_type = 4;
  string business_document_id = 5;
  string reason = 6;
  string accounting_date = 7;  // reversal business date
  string idempotency_key = 8;
  string actor = 9;
}

message GetJournalEntryRequest {
  string tenant_id = 1;        // resolved from metadata in-process
  string entry_no = 2;         // human journal number, e.g. "42" (JE-nn)
  string entry_id = 3;         // optional direct UUID lookup
}

message JournalEntryDetailLine {
  int32 line_no = 1;
  string direction = 2;        // DEBIT | CREDIT
  string account_code = 3;
  string account_name = 4;
  int64 amount_minor = 5;
  string currency_code = 6;
  string description = 7;
}

message JournalEntryDetail {
  string journal_entry_id = 1;
  int64 entry_no = 2;
  string accounting_date = 3;       // "YYYY-MM-DD"
  string currency_code = 4;
  string status = 5;                // POSTED | REVERSED (readable states)
  string description = 6;
  string business_domain = 7;
  string business_doc_type = 8;
  string business_doc_id = 9;
  string case_id = 10;
  string reversed_by_entry_id = 11; // set once the entry was reversed
  int64 total_amount_minor = 12;    // Σ debit (== Σ credit) of the lines
  string created_by = 13;
  string created_at = 14;
  repeated JournalEntryDetailLine lines = 15;
}
