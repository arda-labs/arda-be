syntax = "proto3";

package arda.loan.v1;

option go_package = "github.com/arda-labs/arda/libs/go/arda-proto/loan/v1;loanv1";

// LoanCommandService is the callback surface workflow-service workers use to
// execute loan business steps (mirror of crm CustomerCommandService).
service LoanCommandService {
  rpc UpdateContractStatus(UpdateContractStatusRequest) returns (UpdateContractStatusResponse);
  rpc GetContract(GetContractRequest) returns (ContractBrief);
  rpc CheckFormation(CheckFormationRequest) returns (CheckFormationResponse);
  rpc CheckAdjustment(CheckAdjustmentRequest) returns (CheckAdjustmentResponse);
  rpc ResolveAdjustment(ResolveAdjustmentRequest) returns (ResolveAdjustmentResponse);
  rpc CheckDisbursement(CheckDisbursementRequest) returns (CheckDisbursementResponse);
  rpc GetDisbursementPostingDetail(GetDisbursementPostingDetailRequest) returns (DisbursementPostingDetail);
  rpc SettleDisbursement(SettleDisbursementRequest) returns (SettleDisbursementResponse);
  rpc ResolveDisbursement(ResolveDisbursementRequest) returns (ResolveDisbursementResponse);
  rpc CheckCollection(CheckCollectionRequest) returns (CheckCollectionResponse);
  rpc GetCollectionPostingDetail(GetCollectionPostingDetailRequest) returns (CollectionPostingDetail);
  rpc SettleCollection(SettleCollectionRequest) returns (SettleCollectionResponse);
  rpc ResolveCollection(ResolveCollectionRequest) returns (ResolveCollectionResponse);
  rpc GetBatchPostingDetail(GetBatchRequest) returns (BatchPostingDetail);
  rpc CheckBatch(CheckBatchRequest) returns (CheckBatchResponse);
  rpc SettleBatch(SettleBatchRequest) returns (SettleBatchResponse);
  rpc ResolveBatch(ResolveBatchRequest) returns (ResolveBatchResponse);
  rpc CheckGeneralProvision(CheckGeneralProvisionRequest) returns (CheckGeneralProvisionResponse);
  rpc ResolveGeneralProvision(ResolveGeneralProvisionRequest) returns (ResolveGeneralProvisionResponse);
  rpc CheckSpecificProvision(CheckSpecificProvisionRequest) returns (CheckSpecificProvisionResponse);
  rpc ResolveSpecificProvision(ResolveSpecificProvisionRequest) returns (ResolveSpecificProvisionResponse);
}

message UpdateContractStatusRequest {
  string contract_id = 1;
  string status = 2;
}

message UpdateContractStatusResponse {
  bool ok = 1;
}

message GetContractRequest {
  string contract_id = 1;
}

// Minimal read model of lnm_contracts for the formation workers — the BPMN
// validate/execute/cancel steps only need identity + lifecycle status.
message ContractBrief {
  string contract_id = 1;
  string contract_code = 2;
  string customer_code = 3;
  string status = 4;              // DRAFT | PENDING | ACTIVE | REJECTED | CLOSED
  int64 loan_amt_minor = 5;
  string workflow_case_id = 6;
}

// ── Formation flow (LNM.201.01, LOAN_FORMATION_V2) ──

message CheckFormationRequest {
  string contract_id = 1;
}

message CheckFormationResponse {
  bool ok = 1;
  string message = 2;
}

message CheckAdjustmentRequest {
  string kind = 1;
  string adjustment_id = 2;
}

message CheckAdjustmentResponse {
  bool ok = 1;
  string message = 2;
}

message ResolveAdjustmentRequest {
  string kind = 1;
  string adjustment_id = 2;
  string decision = 3; // APPROVE | REJECT | CANCEL
  string decided_by = 4;
  string note = 5;
}

message ResolveAdjustmentResponse {
  bool ok = 1;
}

// ── Disbursement flow (P1b, LNM.300.02) ──

message CheckDisbursementRequest {
  string disbursement_id = 1;
}

message CheckDisbursementResponse {
  bool ok = 1;
  string message = 2;
}

message GetDisbursementPostingDetailRequest {
  string disbursement_id = 1;
}

// Everything the workflow worker needs to build the LNM_DISB_REGISTER /
// LNM_DISB_COMPLETE PostingRequest without reaching into loan-service
// internals. flow_type selects the rule card legs.
message DisbursementPostingDetail {
  string disbursement_id = 1;
  string disbursement_code = 2;
  string contract_code = 3;
  string agreement_code = 4;
  string disburse_date = 5;
  int64 disburse_amt_minor = 6;
  string currency_code = 7;
  string debt_group_code = 8;
  string org_unit_code = 9;
  string customer_code = 10;
  string fund_source_code = 11;
  string workflow_case_id = 12;
  // REGISTER (default): DEBIT LNM_LOAN_PRINCIPAL / CREDIT FUND_DISBURSEMENT_IN_TRANSIT.
  // COMPLETE: DEBIT FUND_DISBURSEMENT_IN_TRANSIT / CREDIT CASH_SETTLEMENT_ACCOUNT.
  string flow_type = 13;
}

message SettleDisbursementRequest {
  string disbursement_id = 1;
  string journal_entry_id = 2;
  string actor = 3;
}

message SettleDisbursementResponse {
  bool ok = 1;
}

message ResolveDisbursementRequest {
  string disbursement_id = 1;
  string decision = 2; // APPROVE | REJECT
  string decided_by = 3;
  string note = 4;
}

message ResolveDisbursementResponse {
  bool ok = 1;
}


// ── Collection flow (P1b.4, LNM.301.02) ──

message CheckCollectionRequest {
  string collection_id = 1;
}

message CheckCollectionResponse {
  bool ok = 1;
  string message = 2;
}

message GetCollectionPostingDetailRequest {
  string collection_id = 1;
}

message CollectionPostingDetail {
  string collection_id = 1;
  string contract_code = 2;
  string agreement_code = 3;
  string collection_date = 4;
  int64 principal_minor = 5;
  int64 interest_minor = 6;
  string currency_code = 7;
  string debt_group_code = 8;
  string org_unit_code = 9;
  string customer_code = 10;
  string workflow_case_id = 11;
}

message SettleCollectionRequest {
  string collection_id = 1;
  string journal_entry_id = 2;
  string actor = 3;
}

message SettleCollectionResponse {
  bool ok = 1;
}

message ResolveCollectionRequest {
  string collection_id = 1;
  string decision = 2;
  string decided_by = 3;
  string note = 4;
}

message ResolveCollectionResponse {
  bool ok = 1;
}

// ── Batch flows (iteration 13, 1 hồ sơ — N hợp đồng) ──

// tenant_id is carried for traceability; the authoritative tenant scope is
// the propagated X-Tenant-Id metadata.
message GetBatchRequest {
  string tenant_id = 1;
  string batch_id = 2;
  string batch_type = 3; // DISB_REGISTER | DISB_COMPLETE | COLLECTION
}

message BatchRowDetail {
  string row_id = 1;
  string contract_code = 2;
  string agreement_code = 3;
  string plan_code = 4;
  int64 amount_minor = 5;             // disbursement batches (drawdown)
  int64 principal_minor = 6;          // collection batches
  int64 interest_minor = 7;           // collection batches
  int64 overdue_interest_minor = 8;   // collection batches (EPAS 301)
  string debt_group_code = 9;
  string org_unit_code = 10;
  string customer_code = 11;
  bool is_closed = 12;
}

// Everything the workflow worker needs to build one batch PostingRequest
// (N rule-card line pairs) without reaching into loan-service internals.
message BatchPostingDetail {
  string batch_id = 1;
  string batch_code = 2;
  string batch_type = 3;        // DISB_REGISTER | DISB_COMPLETE | COLLECTION
  string txn_date = 4;
  string payment_method = 5;
  string account_code = 6;
  string currency_code = 7;
  int64 total_amt_minor = 8;
  int64 total_principal_minor = 9;
  int64 total_interest_minor = 10;
  string description = 11;
  string org_unit_code = 12;
  string workflow_case_id = 13;
  map<string, string> trader = 14; // camelCase trader block for trader_* metadata
  repeated BatchRowDetail rows = 15;
}

message CheckBatchRequest {
  string batch_id = 1;
  string batch_type = 2;
}

message CheckBatchResponse {
  bool ok = 1;
  string message = 2;
}

message SettleBatchRequest {
  string batch_id = 1;
  string batch_type = 2; // dispatches the loan-service settle loop
  string journal_entry_id = 3;
  string actor = 4;
}

message SettleBatchResponse {
  bool ok = 1;
}

message ResolveBatchRequest {
  string batch_id = 1;
  string batch_type = 2;
  string decision = 3; // APPROVE | REJECT
  string decided_by = 4;
  string note = 5;
}

message ResolveBatchResponse {
  bool ok = 1;
}

// ── General provision flow (LNM.307.01, LNM_GENERAL_PROVISION_V2) ──
//
// The maker submits a per-org provision period; ResolveGeneralProvision
// APPROVE recomputes the delta, posts the LNM_PROVISION rule card and marks
// the period POSTED (single server-side step — the worker stays thin).

message CheckGeneralProvisionRequest {
  string general_provision_id = 1;
}

message CheckGeneralProvisionResponse {
  bool ok = 1;
  string message = 2;
}

message ResolveGeneralProvisionRequest {
  string general_provision_id = 1;
  string decision = 2; // APPROVE | REJECT
  string decided_by = 3;
  string note = 4;
}

message ResolveGeneralProvisionResponse {
  bool ok = 1;
}

// ── Specific provision flow (LNM.306, LNM_SPECIFIC_PROVISION_V1) ──
//
// Per-agreement provision with collateral deduction; APPROVE recomputes and
// posts the LNM_PROVISION_306 card (provisional accounts, chờ dev_fac).

message CheckSpecificProvisionRequest {
  string specific_provision_id = 1;
}

message CheckSpecificProvisionResponse {
  bool ok = 1;
  string message = 2;
}

message ResolveSpecificProvisionRequest {
  string specific_provision_id = 1;
  string decision = 2; // APPROVE | REJECT
  string decided_by = 3;
  string note = 4;
}

message ResolveSpecificProvisionResponse {
  bool ok = 1;
}
