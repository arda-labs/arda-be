app_name: media-service
http_addr: 0.0.0.0:8092
grpc_addr: 0.0.0.0:9090
log_level: info
database_dsn: ""
nats_url: "nats://192.168.10.201:30222,nats://192.168.10.202:30222,nats://192.168.10.203:30222"

storage_provider: garage-main
storage_endpoint: "https://s3.arda.io.vn"
# Browser-facing endpoint used to presign GET redirects (large files). Leave
# empty to always stream through media-service instead of redirecting.
storage_public_endpoint: ""
storage_region: garage
storage_bucket: media
storage_access_key: ""
storage_secret_key: ""
storage_force_path_style: true

upload_max_size_mb: 100
# Files smaller than this are streamed through media-service; larger files are
# redirected to the public storage endpoint (storage_public_endpoint) when
# configured, otherwise they are streamed too.
stream_max_size_mb: 2
# Office → PDF preview conversion through Gotenberg (in-cluster ClusterIP).
# Empty disables the /preview endpoint for Word/Excel/PPT files.
gotenberg_url: ""
preview_max_size_mb: 25
presign_upload_ttl: 15m
presign_download_ttl: 5m
require_scan_before_ready: false
