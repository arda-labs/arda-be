version: '3'

tasks:
  build:
    cmds:
      - go build -o bin/statistical-service ./cmd/statistical-service

  run:
    cmds:
      - go run ./cmd/statistical-service

  test:
    cmds:
      - go test ./...

  lint:
    cmds:
      - go vet ./...

  docker:
    cmds:
      - docker build -t statistical-service:latest .
