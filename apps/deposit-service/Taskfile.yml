version: '3'

tasks:
  build:
    cmds:
      - go build -o bin/deposit-service ./cmd/deposit-service

  run:
    cmds:
      - go run ./cmd/deposit-service

  test:
    cmds:
      - go test ./...

  lint:
    cmds:
      - go vet ./...

  docker:
    cmds:
      - docker build -t deposit-service:latest .
