# Model provider routing configuration for ai-service
# See docs/ai/multi-provider-design.md for specification and schema.
# API keys are read from environment variables; secrets are never placed in this file.

providers:
  - id: openai-gpt4o
    provider: openai
    model_id: gpt-4o
    api_key_env: AI_MODEL_API_KEY
    max_tokens: 4096
    timeout_ms: 30000
    priority: 1
    match:
      tenant_plan: ["enterprise"]

  - id: openai-gpt4o-mini
    provider: openai
    model_id: gpt-4o-mini
    api_key_env: AI_MODEL_API_KEY
    max_tokens: 2048
    timeout_ms: 20000
    priority: 2
    match:
      tenant_plan: ["starter", "professional"]

  - id: ollama-local
    provider: ollama
    model_id: llama3.1:8b
    base_url: http://ollama.arda-infra.svc:11434
    max_tokens: 2048
    timeout_ms: 60000
    priority: 10
    match:
      feature_flags: ["local_model"]
